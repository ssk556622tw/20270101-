<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>房間分配器 - 進階版 (自動記憶)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .chip-selected {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
            z-index: 10;
        }
        
        .room-target {
            border-style: dashed !important;
            border-color: #60a5fa !important;
            background-color: #eff6ff !important;
            cursor: pointer;
        }

        .tap-effect { transition: all 0.15s ease; }
        .tap-effect:active { transform: scale(0.95); }

        .modal-enter { opacity: 1; pointer-events: auto; }
        .modal-leave { opacity: 0; pointer-events: none; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-32 text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-20 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">🏠 房間分配</h1>
        <div class="flex items-center gap-2">
            <button onclick="resetData()" class="text-xs bg-red-100 text-red-700 px-2.5 py-1.5 rounded-lg font-bold shadow-sm active:bg-red-200">
                ↺ 重設
            </button>
            <div class="text-sm bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-lg font-bold shadow-sm" id="header-capacity">
                總床位: 19
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">
        
        <section>
            <div class="flex justify-between items-end mb-2">
                <h2 class="font-bold text-gray-700">待分配名單</h2>
                <span id="unassigned-count" class="text-sm font-medium text-gray-500"></span>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 min-h-[120px]">
                <div id="instruction-banner" class="text-sm font-medium text-center p-2.5 rounded-lg mb-3 bg-gray-50 text-gray-500 transition-colors">
                    👆 請先點擊選擇下方人員
                </div>
                <div id="unassigned-list" class="flex flex-wrap gap-2.5">
                    <!-- Javascript 將動態渲染未分配人員 -->
                </div>
            </div>
        </section>

        <section>
            <h2 class="font-bold text-gray-700 mb-3">房間配置</h2>
            <div id="rooms-list" class="space-y-4">
                <!-- Javascript 將動態渲染房間卡片 -->
            </div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur border-t border-gray-200 p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-20 flex gap-3 justify-center items-center">
        <div class="max-w-md w-full flex gap-3">
            <button onclick="openModal('addPersonModal')" class="tap-effect flex-1 bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                新增人員
            </button>
            <button onclick="exportToLine()" class="tap-effect flex-1 bg-[#06C755] text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                複製結果
            </button>
        </div>
    </div>

    <!-- 新增人員 Modal -->
    <div id="addPersonModal" class="modal-leave fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity duration-200">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-11/12 max-w-sm">
            <h3 class="text-xl font-bold mb-4">新增人員</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">人員/情侶名稱</label>
                    <input type="text" id="newPersonName" placeholder="例如: 小明 或 王大明 & 陳小美" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-blue-500 focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">人員類型</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex flex-col items-center justify-center p-2 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 [&:has(:checked)]:border-blue-500 [&:has(:checked)]:bg-blue-50">
                            <input type="radio" name="personType" value="couple" class="hidden" checked>
                            <span class="text-xl mb-1">👫</span>
                            <span class="text-xs font-bold text-gray-600">情侶 (2人)</span>
                        </label>
                        <label class="flex flex-col items-center justify-center p-2 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 [&:has(:checked)]:border-blue-500 [&:has(:checked)]:bg-blue-50">
                            <input type="radio" name="personType" value="male">
                            <span class="text-xl mb-1">👦</span>
                            <span class="text-xs font-bold text-gray-600">單男 (1人)</span>
                        </label>
                        <label class="flex flex-col items-center justify-center p-2 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 [&:has(:checked)]:border-blue-500 [&:has(:checked)]:bg-blue-50">
                            <input type="radio" name="personType" value="female" class="hidden">
                            <span class="text-xl mb-1">👧</span>
                            <span class="text-xs font-bold text-gray-600">單女 (1人)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeModal('addPersonModal')" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl active:bg-gray-200">取消</button>
                <button onclick="submitAddPerson()" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl active:bg-blue-700 shadow-md">確定新增</button>
            </div>
        </div>
    </div>

    <!-- 重新命名 Modal -->
    <div id="renameModal" class="modal-leave fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity duration-200">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-11/12 max-w-sm">
            <h3 class="text-xl font-bold mb-4">修改房間名稱</h3>
            <input type="hidden" id="editRoomId">
            <input type="text" id="editRoomName" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-blue-500 focus:outline-none transition-colors mb-6">
            
            <div class="flex gap-3">
                <button onclick="closeModal('renameModal')" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl active:bg-gray-200">取消</button>
                <button onclick="submitRenameRoom()" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl active:bg-blue-700 shadow-md">儲存</button>
            </div>
        </div>
    </div>

    <!-- 確認重設 Modal (取代原生的 confirm，體驗更好) -->
    <div id="resetModal" class="modal-leave fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity duration-200">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-11/12 max-w-sm text-center">
            <div class="text-4xl mb-3">⚠️</div>
            <h3 class="text-xl font-bold mb-2">確定要重設紀錄嗎？</h3>
            <p class="text-gray-500 text-sm mb-6">這將會清空目前的分配狀態與新增的人員，並恢復到最一開始的預設資料。</p>
            <div class="flex gap-3">
                <button onclick="closeModal('resetModal')" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl active:bg-gray-200">取消</button>
                <button onclick="executeReset()" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl active:bg-red-700 shadow-md">確定清空</button>
            </div>
        </div>
    </div>

    <!-- 提示訊息 -->
    <div id="toastMessage" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl z-[100] font-bold text-center min-w-[200px] transition-all duration-300 opacity-0 pointer-events-none scale-90">
        <span id="toastIcon"></span> <span id="toastText"></span>
    </div>

    <script>
        // 預設的初始資料
        const initialState = {
            selectedId: null,
            nextPersonId: 100, 
            unassigned: [
                { id: 'p1', name: 'TE 祐緯', size: 2, type: 'couple' },
                { id: 'p2', name: '佳麗 崇仁', size: 2, type: 'couple' },
                { id: 'p3', name: '士峰 小婷', size: 2, type: 'couple' },
                { id: 'p4', name: '羽 廖', size: 2, type: 'couple' },
                { id: 'p5', name: '白 EVEN', size: 2, type: 'couple' },
                { id: 'p6', name: '思 翔', size: 2, type: 'couple' },
                { id: 'p7', name: '柯', size: 1, type: 'female' },
                { id: 'p8', name: '7臻', size: 1, type: 'female' },
                { id: 'p9', name: '耿', size: 1, type: 'male' },
                { id: 'p10', name: '孟', size: 1, type: 'male' },
                { id: 'p11', name: '紅', size: 1, type: 'male' }
            ],
            rooms: [
                { id: 'r1', name: '1F 雙人房+折疊床', capacity: 3, occupants: [] },
                { id: 'r2', name: '2F 雙人房', capacity: 2, occupants: [] },
                { id: 'r3', name: '2F 四人房+折疊床', capacity: 5, occupants: [] },
                { id: 'r4', name: '2F 五人和室', capacity: 5, occupants: [] },
                { id: 'r5', name: '3F 雙人房A', capacity: 2, occupants: [] },
                { id: 'r6', name: '3F 雙人房B', capacity: 2, occupants: [] }
            ]
        };

        let state = {};
        const STORAGE_KEY = "roomAllocatorData";

        // 初始化：檢查是否有儲存的資料
        function initApp() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    state = JSON.parse(savedData);
                    // 確保讀取後的 selectedId 歸零，避免一打開就處於選取狀態
                    state.selectedId = null; 
                } catch (e) {
                    // 若資料毀損，重新載入預設值 (深拷貝避免汙染原始物件)
                    state = JSON.parse(JSON.stringify(initialState));
                }
            } else {
                state = JSON.parse(JSON.stringify(initialState));
            }
            renderUI();
        }

        // 保存資料到 LocalStorage
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // 重設資料邏輯
        function resetData() {
            openModal('resetModal');
        }

        function executeReset() {
            localStorage.removeItem(STORAGE_KEY);
            state = JSON.parse(JSON.stringify(initialState));
            closeModal('resetModal');
            renderUI();
            showToast('已恢復預設狀態');
        }

        // 輔助函式：取得人員的樣式與圖示
        function getPersonStyle(type) {
            switch(type) {
                case 'female': return { bg: 'bg-pink-100', border: 'border-pink-300', text: 'text-pink-800', icon: '👧' };
                case 'male': return { bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', icon: '👦' };
                case 'couple': default: return { bg: 'bg-gray-100', border: 'border-gray-300', text: 'text-gray-800', icon: '👫' };
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastMessage');
            document.getElementById('toastText').innerText = msg;
            document.getElementById('toastIcon').innerText = isError ? '❌' : '✅';
            
            toast.style.backgroundColor = isError ? '#ef4444' : '#1f2937';
            toast.classList.remove('opacity-0', 'scale-90');
            toast.classList.add('opacity-100', 'scale-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-90');
            }, 2500);
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('modal-leave');
            document.getElementById(id).classList.add('modal-enter');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('modal-enter');
            document.getElementById(id).classList.add('modal-leave');
        }

        function renderUI() {
            renderUnassigned();
            renderRooms();
            
            const totalCapacity = state.rooms.reduce((sum, r) => sum + r.capacity, 0);
            document.getElementById('header-capacity').innerText = `總床位: ${totalCapacity}`;

            // 每次渲染完畢，就自動儲存進度！
            saveState();
        }

        function renderUnassigned() {
            const container = document.getElementById('unassigned-list');
            const banner = document.getElementById('instruction-banner');
            const countLabel = document.getElementById('unassigned-count');
            
            const totalUnassignedPeople = state.unassigned.reduce((sum, p) => sum + p.size, 0);
            countLabel.innerText = `剩餘 ${totalUnassignedPeople} 人`;

            if (state.selectedId) {
                const p = state.unassigned.find(x => x.id === state.selectedId);
                if(p) {
                    banner.innerHTML = `已選中 <strong class="text-blue-700">${p.name}</strong> ➔ 請點擊下方房間`;
                    banner.className = "text-sm font-bold text-center p-2.5 rounded-lg mb-3 bg-blue-100 text-blue-800 border border-blue-200 transition-colors animate-pulse";
                }
            } else {
                banner.innerHTML = `👆 請先點擊選擇上方人員`;
                banner.className = "text-sm font-medium text-center p-2.5 rounded-lg mb-3 bg-gray-50 text-gray-500 border border-transparent transition-colors";
            }

            if (state.unassigned.length === 0) {
                container.innerHTML = `<div class="w-full text-center py-4 text-green-600 font-bold bg-green-50 rounded-xl">🎉 所有人員皆已分配完畢</div>`;
                return;
            }

            container.innerHTML = state.unassigned.map(person => {
                const style = getPersonStyle(person.type);
                const isSelected = state.selectedId === person.id;
                const activeClass = isSelected ? 'chip-selected border-blue-500 bg-white' : `${style.bg} ${style.border}`;
                
                return `
                    <button onclick="toggleSelect('${person.id}')" 
                        class="tap-effect border-2 px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all font-bold shadow-sm ${activeClass} ${style.text}">
                        <span class="text-lg">${style.icon}</span>
                        <span>${person.name}</span>
                    </button>
                `;
            }).join('');
        }

        function renderRooms() {
            const container = document.getElementById('rooms-list');
            
            container.innerHTML = state.rooms.map(room => {
                const currentCount = room.occupants.reduce((sum, p) => sum + p.size, 0);
                const isFull = currentCount >= room.capacity;
                const capacityStatus = isFull 
                    ? `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-black border border-red-200">滿房 ${currentCount}/${room.capacity}</span>`
                    : `<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-black border border-green-200 border-dashed">${currentCount}/${room.capacity}</span>`;

                const targetStyle = (state.selectedId && !isFull) ? 'room-target' : 'border-gray-200 bg-white';
                const clickHandler = state.selectedId ? `onclick="assignToRoom('${room.id}')"` : "";

                const occupantsHtml = room.occupants.length === 0 
                    ? `<div class="text-gray-400 text-sm py-3 w-full text-center">空房</div>`
                    : room.occupants.map(person => {
                        const style = getPersonStyle(person.type);
                        return `
                            <button onclick="removeFromRoom(event, '${room.id}', '${person.id}')"
                                class="tap-effect border border-gray-200 bg-white px-2.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1 font-bold text-sm ${style.text} active:bg-red-50 active:border-red-300 active:text-red-600 relative group">
                                ${style.icon} ${person.name}
                                <div class="ml-1 text-gray-300 group-active:text-red-500">✕</div>
                            </button>
                        `;
                    }).join('');

                return `
                    <div ${clickHandler} class="border-2 rounded-2xl overflow-hidden shadow-sm transition-all duration-300 ${targetStyle}">
                        <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center pointer-events-none">
                            <div class="flex items-center gap-2 pointer-events-auto">
                                <h3 class="font-bold text-gray-800 text-base">${room.name}</h3>
                                <button onclick="openRenameModal(event, '${room.id}', '${room.name}')" class="p-1 rounded-md text-gray-400 hover:text-blue-600 hover:bg-blue-50 active:scale-95 transition-all">
                                    ✏️
                                </button>
                            </div>
                            ${capacityStatus}
                        </div>
                        <div class="p-3.5 flex flex-wrap gap-2.5 min-h-[80px] items-start ${state.selectedId ? 'pointer-events-none' : ''}">
                            ${occupantsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSelect(personId) {
            if (state.selectedId === personId) {
                state.selectedId = null;
            } else {
                state.selectedId = personId;
            }
            renderUI();
        }

        function assignToRoom(roomId) {
            if (!state.selectedId) return;

            const pIndex = state.unassigned.findIndex(p => p.id === state.selectedId);
            const rIndex = state.rooms.findIndex(r => r.id === roomId);
            if (pIndex === -1 || rIndex === -1) return;

            const person = state.unassigned[pIndex];
            const room = state.rooms[rIndex];
            const currentCount = room.occupants.reduce((sum, p) => sum + p.size, 0);

            if (currentCount + person.size > room.capacity) {
                showToast(`容量不足！該房間僅剩 ${room.capacity - currentCount} 個空位`, true);
                return;
            }

            room.occupants.push(person);
            state.unassigned.splice(pIndex, 1);
            state.selectedId = null; 
            
            showToast(`已安排至 ${room.name}`);
            renderUI();
        }

        function removeFromRoom(event, roomId, personId) {
            event.stopPropagation(); 
            
            const room = state.rooms.find(r => r.id === roomId);
            if (!room) return;

            const pIndex = room.occupants.findIndex(p => p.id === personId);
            if (pIndex > -1) {
                const person = room.occupants[pIndex];
                room.occupants.splice(pIndex, 1);
                state.unassigned.push(person); 
                
                state.selectedId = null;
                renderUI();
            }
        }

        function openRenameModal(event, roomId, currentName) {
            event.stopPropagation(); 
            document.getElementById('editRoomId').value = roomId;
            document.getElementById('editRoomName').value = currentName;
            openModal('renameModal');
            setTimeout(() => document.getElementById('editRoomName').focus(), 100);
        }

        function submitRenameRoom() {
            const id = document.getElementById('editRoomId').value;
            const newName = document.getElementById('editRoomName').value.trim();
            if (!newName) {
                showToast('請輸入房間名稱', true);
                return;
            }
            
            const room = state.rooms.find(r => r.id === id);
            if (room) {
                room.name = newName;
                closeModal('renameModal');
                showToast('名稱已更新');
                renderUI();
            }
        }

        function submitAddPerson() {
            const nameInput = document.getElementById('newPersonName');
            const name = nameInput.value.trim();
            const type = document.querySelector('input[name="personType"]:checked').value;
            
            if (!name) {
                showToast('請輸入名稱', true);
                return;
            }

            const size = type === 'couple' ? 2 : 1;
            const newPerson = {
                id: `new_${state.nextPersonId++}`,
                name: name,
                size: size,
                type: type
            };

            state.unassigned.push(newPerson);
            
            nameInput.value = '';
            document.querySelector('input[value="couple"]').checked = true;
            closeModal('addPersonModal');
            
            showToast('人員新增成功');
            renderUI();
        }

        function exportToLine() {
            let text = "🏡 民宿房間分配結果\n";
            text += "====================\n\n";
            
            state.rooms.forEach(room => {
                const names = room.occupants.length > 0 
                    ? room.occupants.map(p => p.name).join(', ') 
                    : '(空)';
                text += `📍 ${room.name}：\n👤 ${names}\n\n`;
            });

            if (state.unassigned.length > 0) {
                text += "====================\n";
                text += `⚠️ 尚未分配：\n${state.unassigned.map(p => p.name).join(', ')}`;
            }

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showToast("已成功複製，請至 Line 貼上分享！");
            } catch (err) {
                showToast("複製失敗，請手動選取複製", true);
            }
            document.body.removeChild(textArea);
        }

        // 載入頁面時啟動
        window.onload = initApp;
    </script>
</body>
</html>
